# Every number that can affect a result lives here, not in the code.
# Changing this file is the only supported way to change a result.
seed: 42

paths:
  data_dir: data
  artifacts_dir: artifacts
  results_dir: results
  cache_dir: artifacts/llm_cache

ingest:
  # WebDataset shards of PubLayNet. Each sample is a page render (.png) plus a
  # layout annotation (.json). The annotation has NO text -- hence OCR below.
  dataset_url_template: "https://huggingface.co/datasets/lhoestq/small-publaynet-wds/resolve/main/publaynet-train-{i:06d}.tar"
  num_shards: 1
  max_pages: 200          # POC scale: runs on a laptop in minutes
  min_region_side_px: 8.0
  min_ocr_chars: 20       # below this, OCR output is too noisy to index
  ocr_lang: eng
  ocr_psm: 6              # single uniform block: regions are pre-segmented
  ocr_min_crop_height: 200 # upscale small crops before OCR; measured 0.74 -> 0.99
                           # fidelity on low-resolution pages, saturates at 200px
  save_crops: true

chunk:
  strategy: region        # keeps chunk boundaries aligned to layout regions
  window_chars: 900
  overlap_chars: 150
  min_chunk_chars: 40

models:
  text_embed_model: sentence-transformers/all-MiniLM-L6-v2
  clip_model: openai/clip-vit-base-patch32
  caption_model: Salesforce/blip-image-captioning-base
  enable_captions: false  # STRETCH: adds figure captions to the text corpus
  embed_batch_size: 32
  device: auto

llm:
  backend: anthropic      # anthropic | local | stub
  model: claude-sonnet-4-6
  local_model: Qwen/Qwen2.5-1.5B-Instruct
  max_tokens: 800
  temperature: 0.0        # must stay 0.0; validated in config.py
  cache_enabled: true     # makes evaluation reproducible AND free to re-run

retrieval:
  top_k: 5
  candidate_k: 20
  rrf_k: 60               # Cormack et al. (2009) default
  use_bm25_floor: true
  graph_hops: 1
  max_graph_regions: 5

kg:
  extractor: rule         # rule | llm  (rule runs in CI with no API key)
  entity_types: [method, metric, dataset, finding, figure_ref]
  max_regions_for_extraction: 400

eval:
  k_values: [1, 3, 5, 10]
  primary_k: 5
  n_questions_per_type: 25
  judge_enabled: true
  judge_sample_size: 60
  include_random_floor: true
