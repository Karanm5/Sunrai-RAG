# Groq free-tier config.
#
# Groq's free tier is rate-limited, and this pipeline is call-heavy, so the
# defaults below are tuned to finish comfortably inside the limits:
#   * kg.batch_size: 5      -> 5x fewer requests for the same extraction
#   * requests_per_minute   -> paces requests instead of tripping 429s
#   * cache_enabled: true   -> a re-run costs zero calls
#
# Check Groq's current model list before running; model names change and a
# retired name returns HTTP 400 (which fails fast rather than retrying).
seed: 42

llm:
  backend: groq
  model: llama-3.3-70b-versatile   # verify this is still current
  max_tokens: 800
  temperature: 0.0
  cache_enabled: true
  requests_per_minute: 25          # a little under the tier limit, for headroom
  max_retries: 5
  timeout_s: 90

kg:
  # 'llm' is needed for anything outside ML vocabulary -- the rule extractor
  # finds almost nothing in biomedical text. Batching keeps it affordable.
  extractor: llm
  max_regions_for_extraction: 200
  batch_size: 5                    # regions per call; 5x fewer requests

eval:
  n_questions_per_type: 8
  # Retrieval metrics need no LLM. Leave these false for the fast, zero-call
  # run that produces the graded comparison; flip on for answer quality.
  generate_answers: false
  judge_enabled: false
  judge_sample_size: 20
